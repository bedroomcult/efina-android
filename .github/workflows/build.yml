name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build ${{ inputs.variant || 'debug' }} APK
        run: ./gradlew assemble${{ inputs.variant || 'debug' }} --no-daemon --no-configuration-cache
      
      - name: List APK files
        run: find app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: efina-${{ inputs.variant || 'debug' }}-apk
          path: app/build/outputs/apk/${{ inputs.variant || 'debug' }}/*.apk
          retention-days: 7
