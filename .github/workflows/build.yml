name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'snapshot'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build ${{ inputs.variant }} APK
        run: ./gradlew assemble${{ inputs.variant }} --no-daemon --no-configuration-cache
      
      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
      
      - name: Create Release and Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.apk.outputs.apk }}
          tag: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
            Efina Android APK (${{ inputs.variant }})
            
            Built from `${{ github.ref_name }}` on ${{ github.event.repository.updated_at }}
          allowUpdates: true
          makeLatest: true
