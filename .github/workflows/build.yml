name: Build

# Runs on every push so the compiler is the source of truth. The previous
# workflow was workflow_dispatch-only, so nothing was ever verified automatically.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The backend repository is private, so CI cannot clone it anonymously.
      # tools/backend-routes.json is a committed snapshot of its routes,
      # regenerated with `node tools/check-api-contract.mjs --emit-manifest`.
      - name: Verify every Android route exists on the backend
        run: node tools/check-api-contract.mjs --strict

      - name: Static Kotlin checks
        run: node tools/check-kotlin.mjs --strict

      # Shapes, not just routes: catches a DTO field the handler does not read,
      # and a Kotlin type that cannot parse the column it reads from.
      - name: DTO shapes vs backend
        run: node tools/check-dto-shapes.mjs --strict

  build:
    name: Assemble
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image ships the Android SDK; android-actions/setup-android@v3
      # currently fails against its cmdline-tools 16 layout ("Failed to find package
      # 'tools'"). Only the platform/build-tools are pinned here.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Debug only: no signing material required, so this is safe to run on every
      # push. Release signing lives in release.yml behind a tag and secrets.
      # Unit tests run before assemble: they are fast and independent of packaging.
      # --tests makes "no tests found" a build failure. Without it Gradle happily
      # reports success when the source set is misconfigured and runs nothing.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --tests '*LenientBooleanTest*' 

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: efina-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            app/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true
