name: Release

# Produces a signed release APK + AAB on a version tag.
#   git tag v0.2.0 && git push origin v0.2.0
#
# This was lost when build.yml was replaced during the API rebuild: the old
# workflow bundled assembleRelease and the release action into the same file, so
# overwriting it silently removed the only path to a shippable artifact.
#
# Signing material comes from repository secrets. If they are absent the job
# still builds an unsigned APK so the tag does not fail outright.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'snapshot'

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-release-${{ runner.os }}-

      - name: Derive version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # versionCode must increase monotonically: MAJOR*10000 + MINOR*100 + PATCH
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_CONTENT: ${{ secrets.ANDROID_KEYSTORE_CONTENT }}
        run: |
          if [ -z "$KEYSTORE_CONTENT" ]; then
            # Previously this fell through and published an unsigned APK, which
            # Android refuses to install. A release without signing material is not
            # a release, so stop here instead of shipping something unusable.
            echo "::error::ANDROID_KEYSTORE_CONTENT is not set; refusing to build an unsigned release."
            exit 1
          fi
          # PKCS12 rather than JKS: the container self-describes, and apksigner and
          # the Android Gradle plugin both accept it. A .jks extension on PKCS12
          # content makes keytool guess wrong.
          echo "$KEYSTORE_CONTENT" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "storeType=PKCS12"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # app/build.gradle.kts reads keystore.properties at the repo root when present.
      - name: Build release APK + AAB
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.version }}

      - name: Locate artifacts
        id: artifacts
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk: $APK"
          echo "aab: $AAB"

      # An unsigned APK is unusable: Android rejects it with "package appears to be
      # invalid". v1.0.1 through v1.0.3 shipped exactly that because the workflow
      # treated missing secrets as a warning rather than a failure. Fail loudly now.
      - name: Verify the APK is actually signed
        run: |
          APK="${{ steps.artifacts.outputs.apk }}"
          if ! "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$APK"; then
            echo "::error::APK at $APK is unsigned or the signature does not verify."
            exit 1
          fi
          echo "signature verified for $APK"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.p12"
